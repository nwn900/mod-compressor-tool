name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and type-check
        run: npm run ci

      - name: Test native helper
        run: cargo test --manifest-path native/mod-compressor-helper/Cargo.toml

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Package extension
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $artifact = "mod-compressor-vortex-$version.zip"
          $output = "C:\mod-compressor-$version.zip"
          $required = @(
            'info.json',
            'index.js',
            'native/mod-compressor-helper.exe',
            'README.md',
            'CHANGELOG.md',
            'LICENSE-GPL-3.0.txt'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release file is missing: $file"
            }
          }
          Compress-Archive -Path $required -DestinationPath $output -Force
          echo "artifact=$artifact" >> $env:GITHUB_ENV
          echo "artifact_path=$output" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mod Compressor ${{ github.ref_name }}
          body: |
            See [CHANGELOG](./CHANGELOG.md) for details.
          files: ${{ env.artifact_path }}
          fail_on_unmatched_files: true
