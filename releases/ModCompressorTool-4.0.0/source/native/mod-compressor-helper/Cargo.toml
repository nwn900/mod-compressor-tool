[package]
name = "mod-compressor-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
num_cpus = "1.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
